<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <title>Notesketch soundwave icon</title>
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="#0c0e17"/>
  <rect x="1" y="1" width="46" height="46" rx="11" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <!-- Soundwave Stylus Path -->
  <path d="M8 24 C14 12, 18 36, 24 24 C30 12, 34 36, 40 24" fill="none" stroke="url(#glowGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Glowing playback cursor dot -->
  <circle cx="24" cy="24" r="3.5" fill="#ffffff" filter="url(#glow)"/>
</svg>
